# Publish the webhook container image to Docker Hub (spec-011).
#
# Triggers:
#   push of a semver git tag  → multi-arch build + push.
#     - 'v[0-9]*.[0-9]*.[0-9]*'     stable   → also updates 'latest'
#     - 'v[0-9]*.[0-9]*.[0-9]*-*'   pre-rel  → version tag only (no 'latest')
#   workflow_dispatch          → manual ad-hoc publish (optional image_tag input,
#     defaults to the commit short SHA).
#
# Two jobs:
#   quality — re-runs the Rust gate (fmt + clippy + test), mirroring ci.yml's
#     quality job so a red gate blocks publishing (FR-013).
#   publish — gated on the canonical repo (FR-009); builds linux/amd64 +
#     linux/arm64 (FR-003) and pushes a single multi-arch manifest to
#     aectann/emergency-ration-webhook (FR-011). Depends on `quality`.

name: Publish to Docker Hub

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Hub tag to publish under (defaults to the commit short SHA if omitted)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit + integration + BDD tests
        run: cargo test

  publish:
    name: Build & push multi-arch image
    needs: quality
    if: github.repository == 'AectannArd/emergency-ration-webhook'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (shallow — no history needed for a build)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify required Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets are not set."
            exit 1
          fi
      - name: Set up QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive image tags (metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aectann/emergency-ration-webhook
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
