# Publish container images to Docker Hub (spec-011, constitution Principle XV).
#
# Triggers:
#   push of a semver git tag  → multi-arch build + push.
#     - 'v[0-9]*.[0-9]*.[0-9]*'     stable   → also updates 'latest'
#     - 'v[0-9]*.[0-9]*.[0-9]*-*'   pre-rel  → version tag only (no 'latest')
#   workflow_dispatch          → manual ad-hoc publish (optional image_tag input,
#     defaults to the commit short SHA).
#
# Three jobs:
#   quality — re-runs the Rust gate (fmt + clippy + test), mirroring ci.yml's
#     quality job so a red gate blocks publishing (FR-013).
#   publish — gated on the canonical repo (FR-009); a matrix builds each
#     containerised artifact listed in ARTIFACTS.md (webhook + equalizer) for
#     linux/amd64 + linux/arm64 (FR-003) and pushes a multi-arch manifest per
#     image. Depends on `quality`. Adding a new Docker artifact (Principle XV)
#     means adding an entry to the publish matrix below.
#   charts  — gated on `quality` (like publish); stamps the chart version from
#     the git tag, lints + packages both Helm charts, and attaches the `.tgz`
#     files to the GitHub Release. Runs parallel to `publish`; neither depends
#     on the other (Principle XV — every containerised artifact ships its charts).

name: Publish to Docker Hub

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Hub tag to publish under (defaults to the commit short SHA if omitted)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit + integration + BDD tests
        run: cargo test

  publish:
    name: Build & push ${{ matrix.binary }}
    needs: quality
    if: github.repository == 'AectannArd/emergency-ration-webhook'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: capacity-admission-webhook
            dockerfile: Dockerfile
            image: aectann/emergency-ration-webhook
          - binary: capacity-equalizer
            dockerfile: Dockerfile.equalizer
            image: aectann/emergency-ration-equalizer
    steps:
      - name: Checkout (shallow — no history needed for a build)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify required Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets are not set."
            exit 1
          fi
      - name: Set up QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive image tags (metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  charts:
    name: Package + attach Helm charts
    needs: quality
    if: github.repository == 'AectannArd/emergency-ration-webhook'
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release attaches the .tgz files to the Release.
      contents: write
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Helm
        uses: azure/setup-helm@v3
      - name: Stamp chart versions from the git tag
        run: |
          # vX.Y.Z → X.Y.Z on tag push; workflow_dispatch has no tag
          # (GITHUB_REF_NAME is the branch), so fall back to a dev build
          # stamped with the short SHA.
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}"
          for chart in deploy/charts/webhook deploy/charts/equalizer; do
            sed -i "s|^version:.*|version: \"${VERSION}\"|" "$chart/Chart.yaml"
            sed -i "s|^appVersion:.*|appVersion: \"${VERSION}\"|" "$chart/Chart.yaml"
          done
      - name: Lint charts (gate)
        run: |
          helm lint deploy/charts/webhook
          helm lint deploy/charts/equalizer
      - name: Package charts
        run: |
          mkdir -p .temp/charts
          helm package deploy/charts/webhook --destination .temp/charts/
          helm package deploy/charts/equalizer --destination .temp/charts/
      - name: Attach charts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .temp/charts/emergency-ration-webhook-*.tgz
            .temp/charts/emergency-ration-equalizer-*.tgz
