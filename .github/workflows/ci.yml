# CI for the capacity admission webhook (T041).
#
# Two jobs:
#   quality — the k8s-version-independent Rust gate (fmt, clippy, unit +
#     integration + BDD tests). Runs once.
#   e2e     — the N-2 Kubernetes matrix (1.34/1.35/1.36) per Principle VII:
#     build the image, stand up a kind cluster, apply the manifests, and smoke
#     test the webhook (fail-closed when over budget).

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit + integration + BDD tests
        run: cargo test

  e2e:
    name: E2E on k8s ${{ matrix.k8s }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Principle VII: the three most recent Kubernetes releases (N-2).
        # Pin explicit kindest/node tags: v1.36.0 was never published (kind
        # jumped straight to v1.36.1), and constructing from `v{ver}.0` breaks
        # when the .0 patch doesn't exist.
        include:
          - k8s: "1.34"
            node_image: kindest/node:v1.34.0
          - k8s: "1.35"
            node_image: kindest/node:v1.35.0
          - k8s: "1.36"
            node_image: kindest/node:v1.36.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin capacity-admission-webhook
      - name: Build image
        run: docker build -t capacity-admission-webhook:e2e .
      - name: Create kind cluster (k8s ${{ matrix.k8s }})
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          cluster_name: capacity-e2e
          node_image: ${{ matrix.node_image }}
          wait: 60s
      - name: Load image into kind
        run: kind load docker-image capacity-admission-webhook:e2e --name capacity-e2e
      - name: Apply manifests (manual TLS fallback — no cert-manager in CI)
        run: |
          # Generate a self-signed serving cert for the in-cluster Service DNS.
          # `prompt = no` is required: without it openssl waits for interactive
          # DN input, which hangs and is killed in the non-interactive CI shell.
          cat > csr.conf <<EOF
          [req]
          prompt = no
          req_extensions = v3_req
          distinguished_name = dn
          [v3_req]
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = capacity-admission-webhook
          DNS.2 = capacity-admission-webhook.capacity-admission
          DNS.3 = capacity-admission-webhook.capacity-admission.svc
          [dn]
          CN = capacity-admission-webhook
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -keyout tls.key -out tls.crt \
            -days 1 -config csr.conf -extensions v3_req

          # Create the namespace first — RBAC and the Deployment reference it.
          kubectl create namespace capacity-admission --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f deploy/rbac.yaml
          kubectl apply -f deploy/crds.yaml

          # Create the TLS Secret BEFORE the Deployment — the pods mount it
          # at /tls and CrashLoopBackOff if it is not present at start time.
          kubectl -n capacity-admission create secret tls capacity-admission-webhook-tls \
            --cert=tls.crt --key=tls.key

          # Patch the image placeholder to the kind-loaded tag BEFORE applying
          # the Deployment, so pods are created with the correct image from the
          # start (avoids ImagePullBackOff on :latest). spec-009 changed the
          # manifest from a bare image name to ERW_IMAGE_PLACEHOLDER.
          sed 's|image: ERW_IMAGE_PLACEHOLDER|image: capacity-admission-webhook:e2e|' \
            deploy/deployment.yaml | kubectl apply -f -

          CABUNDLE="$(base64 -w0 tls.crt)"
          sed "s|# caBundle: .*|caBundle: ${CABUNDLE}|" deploy/webhook-config.yaml \
            | kubectl apply -f -
      - name: Wait for webhook readiness
        run: |
          if ! kubectl -n capacity-admission wait --for=condition=Ready pod \
            -l app=capacity-admission-webhook --timeout=120s; then
            echo "::group::Pod describe (debug)"
            kubectl -n capacity-admission describe pod -l app=capacity-admission-webhook
            echo "::endgroup::"
            echo "::group::Pod logs (debug)"
            kubectl -n capacity-admission logs -l app=capacity-admission-webhook --tail=50 || true
            echo "::endgroup::"
            echo "::group::Events (debug)"
            kubectl -n capacity-admission get events --sort-by=.lastTimestamp | tail -20
            echo "::endgroup::"
            exit 1
          fi
      - name: Configure the budget
        run: |
          # The Node Capacity Controller now auto-creates the cluster-capacity
          # singleton, so CI no longer creates it manually (the smoke test
          # verifies status gets populated without it). The Allocation singleton
          # is also auto-created by its controller (default budget 80%); we apply
          # it explicitly here to assert the controller does NOT overwrite an
          # operator-set value.
          kubectl apply -f - <<EOF
          apiVersion: emergency-ration.dev/v1
          kind: Allocation
          metadata:
            name: cluster-allocation
          spec:
            budgetPercent: 80
          EOF
      - name: Smoke test — a small pod is admitted, an over-budget pod is denied
        run: |
          # The controllers auto-create their singletons on startup and write
          # status within their first reconcile window. Wait for a NON-ZERO
          # ceiling before admission testing: a zero ceiling is the fail-closed
          # state (the Node Capacity Controller's supply has not yet propagated
          # into the Allocation Controller's cache on startup). Matching a bare
          # "0" would proceed too early and the webhook would deny even the
          # valid smoke pod. A non-zero ceiling means supply is known and the
          # system is ready to admit.
          echo "Waiting for a non-zero Allocation ceiling (capacity known)..."
          for i in $(seq 1 30); do
            cpu=$(kubectl get allocation cluster-allocation -o jsonpath='{.status.ceilingCpuMilli}' 2>/dev/null)
            mem=$(kubectl get allocation cluster-allocation -o jsonpath='{.status.ceilingMemoryBytes}' 2>/dev/null)
            if [ -n "$cpu" ] && [ "$cpu" -gt 0 ] 2>/dev/null \
               && [ -n "$mem" ] && [ "$mem" -gt 0 ] 2>/dev/null; then
              echo "Allocation ready: ceilingCpuMilli=$cpu, ceilingMemoryBytes=$mem (after ${i}s)."
              break
            fi
            sleep 1
          done

          cpu=$(kubectl get allocation cluster-allocation -o jsonpath='{.status.ceilingCpuMilli}' 2>/dev/null)
          if [ -z "$cpu" ] || ! [ "$cpu" -gt 0 ] 2>/dev/null; then
            echo "::group::CRD + controller state (debug — zero/missing ceiling)"
            kubectl get allocation cluster-allocation -o yaml || true
            kubectl get clustercapacity cluster-capacity -o yaml || true
            kubectl -n capacity-admission logs -l app=capacity-admission-webhook --tail=80 || true
            echo "::endgroup::"
            echo "ERROR: Allocation ceiling never became non-zero (last ceilingCpuMilli='${cpu:-<empty>}')."
            exit 1
          fi

          # kubectl run --requests was removed in newer kubectl versions;
          # apply explicit Pod manifests instead.

          # A small pod in an allowed namespace must be admitted.
          cat <<'POD' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-ok
            namespace: default
          spec:
            restartPolicy: Never
            containers:
              - name: nginx
                image: nginx
                resources:
                  requests:
                    cpu: 10m
                    memory: 10Mi
          POD

          # An over-budget request must be denied by the webhook (fail-closed).
          if cat <<'POD' | kubectl apply -f - 2>&1; then
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-over
            namespace: default
          spec:
            restartPolicy: Never
            containers:
              - name: nginx
                image: nginx
                resources:
                  requests:
                    cpu: 999
                    memory: 999Gi
          POD
            echo "ERROR: over-budget pod was admitted — webhook should have denied it!"
            exit 1
          else
            echo "Over-budget pod correctly denied by the webhook."
          fi
      - name: Run ignored tests (performance benchmark)
        run: cargo test --test performance -- --ignored --nocapture

  # T044 quality gate is composed of the `quality` job above plus this final
  # editor-config compliance check.
  editorconfig:
    name: .editorconfig compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: editorconfig-checker/action-editorconfig-checker@main
