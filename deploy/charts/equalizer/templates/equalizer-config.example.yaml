{{- if false }}
# Example EqualizerConfig + target kubeconfig Secrets (spec-013, research R10).
#
# Operator quickstart reference (Constitution Principle X). This block is
# deliberately disabled (`if false`) so `helm install` does NOT render it — the
# EqualizerConfig singleton and kubeconfig Secrets are operator-specific runtime
# configuration (contain BASE64_KUBECONFIG_* placeholders) applied separately
# after install. Copy this into a values override or a separate manifest, replace
# the base64 values, and apply with `kubectl apply -f`.
#
# The EqualizerConfig singleton is cluster-scoped (instance `fleet-equalizer`);
# it lists every target cluster — including the one the equalizer runs in — by
# name + a kubeconfig Secret reference. This example targets two clusters,
# `cluster-a` and `cluster-b`, both converging toward an 80% CPU + 80% memory
# fleet budget. Replace the base64 kubeconfig values with each target's real
# kubeconfig (see the target-cluster RBAC comment in rbac.yaml for the identity
# each kubeconfig should carry).
---
# Kubeconfig for cluster-a (base64-encoded YAML). Generate with:
#   base64 -w0 cluster-a.kubeconfig
# and paste after `kubeconfig:`.
apiVersion: v1
kind: Secret
metadata:
  name: target-cluster-a
  namespace: capacity-equalizer
type: Opaque
data:
  kubeconfig: BASE64_KUBECONFIG_CLUSTER_A

---
apiVersion: v1
kind: Secret
metadata:
  name: target-cluster-b
  namespace: capacity-equalizer
type: Opaque
data:
  kubeconfig: BASE64_KUBECONFIG_CLUSTER_B

---
apiVersion: emergency-ration.dev/v1
kind: EqualizerConfig
metadata:
  name: fleet-equalizer # singleton; the equalizer reads this exact name.
spec:
  # Fleet-wide budget targets (0–100). Each resource is equalized independently
  # (FR-014): CPU and memory converge to these averages separately.
  cpuTargetBudgetPercent: 80
  memoryTargetBudgetPercent: 80
  targets:
    - name: cluster-a
      kubeconfigSecretRef:
        name: target-cluster-a # the Secret above
        key: kubeconfig # the key holding the kubeconfig YAML (default: "kubeconfig")
        namespace: capacity-equalizer
    - name: cluster-b
      kubeconfigSecretRef:
        name: target-cluster-b
        key: kubeconfig
        namespace: capacity-equalizer
# After apply, the equalizer writes .status on each cycle, e.g.:
#   kubectl get equalizerconfig fleet-equalizer -o yaml
#   kubectl get eqconf fleet-equalizer -o jsonpath='{.status.condition}'
{{- end }}
