apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "equalizer.name" . }}
  namespace: {{ template "equalizer.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "equalizer.name" . }}
rules:
  # EqualizerConfig CRD: read the singleton + write its status (reconcile loop).
  # Full CRUD is granted so operators can manage the singleton through the same
  # ServiceAccount if desired (the binary itself only reads + patches status).
  - apiGroups: ["emergency-ration.dev"]
    resources: ["equalizerconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["emergency-ration.dev"]
    resources: ["equalizerconfigs/status"]
    verbs: ["get", "update", "patch"]
  # Target kubeconfig Secrets — the EqualizerConfig references one Secret per
  # target cluster, in whichever namespace the operator stores them.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "equalizer.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "equalizer.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ template "equalizer.name" . }}
    namespace: {{ template "equalizer.namespace" . }}

# ---------------------------------------------------------------------------
# TARGET-CLUSTER RBAC (apply in EACH target cluster, not the home cluster).
#
# The equalizer connects to each target cluster using the kubeconfig stored in
# that target's Secret. That kubeconfig's identity (typically a ServiceAccount
# in the target cluster) must be able to read the target's Allocation +
# ClusterCapacity status and PATCH the Allocation spec overrides. Apply the
# following in every target cluster:
#
# ---
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: capacity-equalizer
#   namespace: default            # any namespace; reference it in the kubeconfig
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: capacity-equalizer-target
# rules:
#   - apiGroups: ["emergency-ration.dev"]
#     resources: ["allocations"]
#     verbs: ["get", "patch"]     # read utilization status + write spec overrides
#   - apiGroups: ["emergency-ration.dev"]
#     resources: ["clustercapacities"]
#     verbs: ["get"]              # read allocatable capacity status
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: capacity-equalizer-target
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: capacity-equalizer-target
# subjects:
#   - kind: ServiceAccount
#     name: capacity-equalizer
#     namespace: default
#
# Then build the target's kubeconfig from that ServiceAccount's token and store
# it in the home-cluster Secret referenced by EqualizerConfig.spec.targets[].
# ---------------------------------------------------------------------------
