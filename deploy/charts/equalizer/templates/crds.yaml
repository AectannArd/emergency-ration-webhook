# EqualizerConfig CustomResourceDefinition manifest (spec-013, T038).
#
# Group/apiVersion: emergency-ration.dev/v1. Cluster-scoped singleton instance
# `fleet-equalizer` whose `.spec` carries the per-resource budget targets + the
# target cluster list (kubeconfig Secret refs) and whose `.status` is written by
# the equalizer's reconcile loop (per-cluster observations + fleet condition).
#
# Generated from `EqualizerConfig::crd()` (kube derive). Regenerate, if the spec
# structs in src/equalizer/crd.rs change, with:
#   cargo run --example gen-equalizer-crd > deploy/kustomize/equalizer/crds.yaml
# (then re-add this header). Schema matches contracts/equalizer-config-crd.md §2-3.

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: equalizerconfigs.emergency-ration.dev
spec:
  group: emergency-ration.dev
  names:
    kind: EqualizerConfig
    plural: equalizerconfigs
    shortNames:
    - eqconf
    singular: equalizerconfig
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for EqualizerConfigSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Spec of the EqualizerConfig CRD. The operator-configurable budget targets +
              target cluster list.
            properties:
              cpuTargetBudgetPercent:
                description: |-
                  Cumulative CPU budget target (0–100). The fleet average CPU utilization
                  converges to this value. Each resource is equalized independently
                  (FR-014).
                format: int32
                maximum: 100.0
                minimum: 0.0
                type: integer
              memoryTargetBudgetPercent:
                description: Cumulative memory budget target (0–100). Independent from CPU.
                format: int32
                maximum: 100.0
                minimum: 0.0
                type: integer
              targets:
                description: |-
                  Target cluster definitions. Every cluster — including the one the
                  equalizer runs in — is specified here (FR-003). Minimum 1 entry.
                items:
                  properties:
                    kubeconfigSecretRef:
                      description: Reference to the Secret containing this cluster's kubeconfig (FR-003).
                      properties:
                        key:
                          default: kubeconfig
                          description: |-
                            Key within the Secret whose value is the kubeconfig YAML. Defaults to
                            `"kubeconfig"` (contract §2.3.2.2).
                          type: string
                        name:
                          description: Secret name.
                          type: string
                        namespace:
                          description: Namespace where the Secret lives (typically the equalizer's namespace).
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    name:
                      description: Human-readable cluster name. Must be unique within `targets[]`.
                      type: string
                  required:
                  - kubeconfigSecretRef
                  - name
                  type: object
                type: array
            required:
            - cpuTargetBudgetPercent
            - memoryTargetBudgetPercent
            - targets
            type: object
          status:
            description: Status of the EqualizerConfig CRD, populated by the reconcile loop.
            nullable: true
            properties:
              clusters:
                description: Per-cluster observations from the last reconcile cycle (FR-010).
                items:
                  properties:
                    computedCpuBudgetPercent:
                      description: Computed CPU budget the equalizer applied (or would apply if reachable).
                      format: int32
                      type: integer
                    computedMemoryBudgetPercent:
                      description: Computed memory budget.
                      format: int32
                      type: integer
                    cpuUtilizationPercent:
                      description: Observed CPU utilization (from `Allocation.status.utilizationPercentCpu`).
                      format: double
                      type: number
                    lastError:
                      description: Last error message (present iff `state` is `Unreachable` or `ConfigError`).
                      nullable: true
                      type: string
                    lastObserved:
                      description: Timestamp (RFC 3339) of the last successful observation of this cluster.
                      type: string
                    memoryUtilizationPercent:
                      description: Observed memory utilization.
                      format: double
                      type: number
                    name:
                      description: Cluster name (matches `spec.targets[].name`).
                      type: string
                    state:
                      description: Cluster state in the equalization.
                      enum:
                      - healthy
                      - over
                      - unreachable
                      - config-error
                      type: string
                    totalAllocatableCpuMilli:
                      description: Observed total allocatable CPU, milli (from `ClusterCapacity.status`).
                      format: int64
                      type: integer
                    totalAllocatableMemoryBytes:
                      description: Observed total allocatable memory, bytes.
                      format: int64
                      type: integer
                  required:
                  - computedCpuBudgetPercent
                  - computedMemoryBudgetPercent
                  - cpuUtilizationPercent
                  - lastObserved
                  - memoryUtilizationPercent
                  - name
                  - state
                  - totalAllocatableCpuMilli
                  - totalAllocatableMemoryBytes
                  type: object
                type: array
              condition:
                description: Overall fleet condition (FR-011).
                enum:
                - healthy
                - compensating
                - degraded
                type: string
              lastReconciled:
                description: Timestamp of the last successful reconcile cycle (RFC 3339).
                type: string
            required:
            - clusters
            - condition
            - lastReconciled
            type: object
        required:
        - spec
        title: EqualizerConfig
        type: object
    served: true
    storage: true
    subresources:
      status: {}
