# ClusterCapacity + Allocation CustomResourceDefinition manifests (T022).
#
# Group/apiVersion: emergency-ration.dev/v1. Both are cluster-scoped singletons
# (ClusterCapacity "cluster-capacity", Allocation "cluster-allocation") whose
# `.status` is written by the controllers and read by the admission webhook. The
# schemas match data-model.md §1–2 and the derive-generated OpenAPI in
# `ClusterCapacity::crd()` / `Allocation::crd()`.

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustercapacities.emergency-ration.dev
spec:
  group: emergency-ration.dev
  names:
    kind: ClusterCapacity
    plural: clustercapacities
    singular: clustercapacity
    shortNames: ["cc"]
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties: {}
            status:
              type: object
              properties:
                totalAllocatableCpuMilli:
                  type: integer
                  format: int64
                  minimum: 0
                totalAllocatableMemoryBytes:
                  type: integer
                  format: int64
                  minimum: 0
                nodeCount:
                  type: integer
                  format: int32
                  minimum: 0
                lastUpdated:
                  type: string
                  description: Timestamp of the last capacity recomputation (RFC 3339).

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: allocations.emergency-ration.dev
spec:
  group: emergency-ration.dev
  names:
    kind: Allocation
    plural: allocations
    singular: allocation
    shortNames: ["alloc"]
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["budgetPercent"]
              properties:
                budgetPercent:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 100
                  description: >
                    Maximum allowed allocation as a percentage of total
                    allocatable capacity (0–100). Applied to both CPU and RAM
                    independently. 0 rejects all requests; 100 only rejects
                    genuine overcommit beyond physical capacity.
                enforcementMode:
                  type: string
                  nullable: true
                  enum: ["enforce", "dry-run"]
                  description: >
                    Enforcement mode. When 'dry-run', over-budget pods are
                    admitted with a warning instead of rejected; fail-closed paths
                    (stale/missing capacity data, malformed request, timeout,
                    panic) still reject in both modes. Defaults to 'enforce' when
                    absent.
            status:
              type: object
              properties:
                allocatedCpuMilli:
                  type: integer
                  format: int64
                  minimum: 0
                allocatedMemoryBytes:
                  type: integer
                  format: int64
                  minimum: 0
                ceilingCpuMilli:
                  type: integer
                  format: int64
                  minimum: 0
                ceilingMemoryBytes:
                  type: integer
                  format: int64
                  minimum: 0
                utilizationPercentCpu:
                  type: number
                  format: double
                utilizationPercentMemory:
                  type: number
                  format: double
                lastUpdated:
                  type: string
                  description: Timestamp of the last allocation recomputation (RFC 3339).
