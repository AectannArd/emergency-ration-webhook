# Namespace + Deployment for the multi-cluster capacity equalizer (spec-013, T040).
#
# The equalizer is a standalone controller, deployed independently from the
# admission webhook (research R8): it polls the EqualizerConfig singleton every
# EQUALIZER_RECONCILE_INTERVAL_SECS, reconciles the fleet, and writes
# EqualizerConfig.status. It exposes no network ports (no admission/metrics HTTP
# server), so there are no Services or probes. A single replica is sufficient —
# the reconcile cycle is idempotent (strategic PATCH of override fields only),
# so a leader-elected singleton matches the standard controller pattern.

---
apiVersion: v1
kind: Namespace
metadata:
  name: capacity-equalizer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-equalizer
  namespace: capacity-equalizer
  labels:
    app: capacity-equalizer
spec:
  replicas: 1 # idempotent reconcile; a singleton controller suffices.
  selector:
    matchLabels:
      app: capacity-equalizer
  template:
    metadata:
      labels:
        app: capacity-equalizer
    spec:
      serviceAccountName: capacity-equalizer # see rbac.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: equalizer
          # Resolved by the `images:` directive in kustomization.yaml to
          # `aectann/emergency-ration-equalizer:latest`. Override at apply time
          # with `kustomize edit set image` or a rendered-output sed (see the
          # equalizer docs). Built by Dockerfile.equalizer
          # (`cargo build --release --bin capacity-equalizer`).
          image: capacity-equalizer:placeholder
          imagePullPolicy: Always
          env:
            # Reconcile interval (data-model §3, contract §4.1). Default 10s.
            - name: EQUALIZER_RECONCILE_INTERVAL_SECS
              value: "10"
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
