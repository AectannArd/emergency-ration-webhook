# ValidatingWebhookConfiguration registering the admission webhook (T039).
#
# Matches contracts/admission-webhook.md §Webhook Configuration Contract:
#   - failurePolicy: Fail   (Principle I: fail-closed)
#   - sideEffects: None     (validating-only, v1 requirement)
#   - timeoutSeconds: 5     (apiserver-level; internal --decision-timeout is tighter)
#   - matchPolicy: Exact
#   - rules: pods CREATE + UPDATE
#   - namespaceSelector: defence-in-depth for the webhook's own namespace only
#     (spec-008; system-namespace exclusion moved to the Allocation CRD)
#
# The caBundle is injected by cert-manager's ca-injector (see cert-setup.yaml
# annotation) or provided manually as base64.

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: capacity-admission.emergency-ration.dev
  labels:
    app: capacity-admission-webhook
  # cert-manager injects the CA bundle into the webhook clientConfig.caBundle.
  annotations:
    cert-manager.io/inject-ca-from: capacity-admission/capacity-admission-webhook
webhooks:
  - name: capacity-admission.emergency-ration.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail # Principle I: fail-closed.
    matchPolicy: Exact
    timeoutSeconds: 5
    clientConfig:
      service:
        name: capacity-admission-webhook
        namespace: capacity-admission
        path: "/validate"
        port: 8443
      # caBundle: <base64-encoded CA cert, injected by cert-manager or manual>
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
        scope: "*"
    namespaceSelector:
      matchExpressions:
        # Defence-in-depth only: the apiserver filters the webhook's OWN namespace
        # so the webhook can never self-gate, even during cold start before its
        # Allocation cache is populated (FR-009). System-namespace and
        # priority-class exclusions are now operator-configured on the Allocation
        # CRD (spec-008 excludedNamespaces / excludedPriorityClasses) and enforced
        # by the webhook at runtime via check_exemption — they are intentionally
        # NOT hardcoded here so operators can change them without re-deploying the
        # ValidatingWebhookConfiguration.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["capacity-admission"]
