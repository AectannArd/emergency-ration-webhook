# Namespace + Deployment + Service for the capacity admission webhook (T038).
#
# Per research.md R8: a Deployment with 2 replicas provides redundancy (both
# replicas serve admission requests from their local reflector caches; caches
# converge so both reject when over budget). Resource requests stay under the
# SC-006 footprint target (< 256 MiB memory, < 500m CPU). TLS cert/key are
# mounted from a Secret (R9). Namespace: capacity-admission.

---
apiVersion: v1
kind: Namespace
metadata:
  name: capacity-admission

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-admission-webhook
  namespace: capacity-admission
  labels:
    app: capacity-admission-webhook
spec:
  replicas: 2 # R8: redundancy for the cluster-level admission service.
  selector:
    matchLabels:
      app: capacity-admission-webhook
  template:
    metadata:
      labels:
        app: capacity-admission-webhook
    spec:
      serviceAccountName: capacity-admission-webhook # see rbac.yaml
      # The webhook's own pods land in an excluded namespace (webhook-config.yaml
      # namespaceSelector), avoiding the bootstrap self-admission problem.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          # Build locally (see Dockerfile) and push to your registry, then update:
          image: capacity-admission-webhook:latest
          imagePullPolicy: IfNotPresent
          args:
            - --port=8443
            - --metrics-port=9090
            - --tls-cert-file=/tls/tls.crt
            - --tls-key-file=/tls/tls.key
            - --decision-timeout-ms=100
            - --capacity-freshness-timeout-secs=30
          ports:
            - name: webhook
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          env:
            - name: RUST_LOG
              value: debug
          # SC-006: requests below 256 MiB / 500m.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # kubelet probes reach the plaintext HTTP /healthz on the metrics port.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: tls
          secret:
            # Created by cert-setup.yaml (cert-manager) or provided manually (R9).
            secretName: capacity-admission-webhook-tls

---
apiVersion: v1
kind: Service
metadata:
  name: capacity-admission-webhook
  namespace: capacity-admission
spec:
  selector:
    app: capacity-admission-webhook
  ports:
    # Admission endpoint referenced by the ValidatingWebhookConfiguration.
    - name: webhook
      port: 8443
      targetPort: webhook
    # Plaintext scrape/probe port (quickstart: `kubectl port-forward ... 9090:metrics`).
    - name: metrics
      port: 9090
      targetPort: metrics
