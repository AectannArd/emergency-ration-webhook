[package]
name = "capacity-admission-webhook"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Kubernetes validating admission webhook that enforces a cluster capacity budget."
license = "Apache-2.0"

[[bin]]
name = "capacity-admission-webhook"
path = "src/main.rs"

# On-demand infrastructure verification tool (spec-005). Auto-discovers
# `src/bin/erw-verify/main.rs`. A second binary keeps rcgen + serde_yaml out of
# the webhook's production dependency tree (Constitution Principle V).
[[bin]]
name = "erw-verify"
path = "src/bin/erw-verify/main.rs"

# spec-013: multi-cluster capacity equalizer binary. A separate image keeps the
# equalizer's deployment lifecycle independent from the webhook (research R8).
[[bin]]
name = "capacity-equalizer"
path = "src/bin/capacity-equalizer/main.rs"

[lib]
name = "capacity_admission_webhook"
path = "src/lib.rs"

# Integration test targets live under tests/ subdirectories, so they must be
# declared explicitly (Cargo only auto-discovers direct children of tests/).
[[test]]
name = "budget_enforcement"
path = "tests/integration/budget_enforcement.rs"

[[test]]
name = "capacity_awareness"
path = "tests/integration/capacity_awareness.rs"

[[test]]
name = "fail_safe"
path = "tests/integration/fail_safe.rs"

[[test]]
name = "dry_run"
path = "tests/integration/dry_run.rs"

# spec-008: workload-exclusion integration tests (namespace + priority class).
[[test]]
name = "exclusion"
path = "tests/integration/exclusion.rs"

# spec-006: node-filter integration tests (mock apiserver).
[[test]]
name = "node_filter"
path = "tests/integration/node_filter.rs"

[[test]]
name = "performance"
path = "tests/integration/performance.rs"

[[test]]
name = "budget_bdd"
path = "tests/bdd/budget_steps.rs"
harness = false

[[test]]
name = "capacity_awareness_bdd"
path = "tests/bdd/steps/capacity_steps.rs"
harness = false

[[test]]
name = "fail_safe_bdd"
path = "tests/bdd/steps/fail_safe_steps.rs"
harness = false

[[test]]
name = "dry_run_bdd"
path = "tests/bdd/steps/dry_run_steps.rs"
harness = false

# spec-006: node-filter BDD scenarios (@cordon / @selector / @observability).
[[test]]
name = "node_filter_bdd"
path = "tests/bdd/steps/node_filter_steps.rs"
harness = false

# spec-005: unit tests for the verify tool's pure modules (report rendering,
# exit-code derivation, CLI arg parsing). They `#[path]`-include the binary's
# source files so the pure logic stays under `src/bin/erw-verify/` (Principle V)
# while remaining unit-testable without a cluster (Principle VIII).
[[test]]
name = "verify_report"
path = "tests/verify/report.rs"

[[test]]
name = "verify_args"
path = "tests/verify/args.rs"

# spec-013: equalizer unit/integration test targets live under tests/equalizer/,
# so they must be declared explicitly (Cargo only auto-discovers direct children
# of tests/ — Pitfall #1).
[[test]]
name = "algorithm"
path = "tests/equalizer/algorithm.rs"

[dependencies]
# Kubernetes client, watcher/reflector/Controller runtime, CRD derive macro.
# `admission` brings in the AdmissionReview/AdmissionResponse types
# (k8s-openapi does not ship them; using the standard kube types keeps
# serialisation correct — Constitution Principle V: prefer standard types).
kube = { version = "4.2.0", features = ["runtime", "derive", "client", "rustls-tls", "admission"] }
# Built-in Kubernetes types (Pod, Node, AdmissionReview, Quantity).
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
# JSON Schema generation for CRD validation schemas (required by kube derive).
schemars = "1"
# Async runtime.
tokio = { version = "1", features = ["full"] }
# Stream combinators — required to drive kube-rs reflector/Controller streams
# (`Controller::run` / `reflector` return `impl Stream`; `for_each`/`next` need
# `StreamExt`). Already resolved in Cargo.lock as a former dev-dependency, so this
# adds no new download or version.
futures = "0.3"
# HTTP server for the admission webhook endpoint.
axum = "0.8"
# TLS termination (rustls 0.23 provider controlled at runtime; ring crypto).
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
# Serialisation of AdmissionReview and CRD objects.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Metrics exposition (admission verdicts, latency, capacity utilisation).
prometheus = "0.14"
# Ergonomic error enums.
thiserror = "2"
# spec-005 (erw-verify only): pure-Rust self-signed TLS certificate generation —
# no OpenSSL dependency (research R3). Used by setup.rs to build the webhook's
# serving cert + the webhook-config caBundle in-process.
rcgen = "0.13"
# spec-005 (erw-verify only): multi-document YAML manifest parsing for the
# embedded `deploy/*.yaml` files (research R2). serde_json alone cannot split a
# `---`-delimited manifest stream.
serde_yaml = "0.9"
# spec-005 (erw-verify only): base64-encode the serving cert into the TLS Secret
# and the webhook-config caBundle. (Already a transitive dep; pinned explicitly.)
base64 = "0.22"
# spec-005 (erw-verify only): raw `http::Request` for the metrics/healthz API-proxy
# GETs (research R8/R10). Already a transitive dep of kube; pinned explicitly so the
# verify binary can name it without pulling a new download.
http = "1"

[dev-dependencies]
# Mocked apiserver as a tower::Service for integration tests.
tower = "0.5"
tower-test = "0.4"
http-body-util = "0.1"
# BDD (cucumber-rs) execution for .feature files.
cucumber = "0.23"
